name: CL-DIR-001 A-G
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  A:
    name: A - Python static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; GitHub ref verified 2026-11-14
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5; GitHub ref verified 2026-11-14
        with:
          python-version: '3.12.14'
      - shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          python -m pip install -r scripts/requirements-ci.lock 2>&1 | tee reports/A-1.log
      - shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          python -m pip check 2>&1 | tee reports/A-2.log
      - shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          ruff format --check scripts/build_release.py scripts/lock_pyodide.py scripts/ci_gate.py scripts/check_reproducible.py scripts/ci_math.py scripts/check_python_lock.py tests/oracles/test_build_pipeline.py 2>&1 | tee reports/A-3.log
      - shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          mypy scripts/build_release.py scripts/lock_pyodide.py scripts/ci_gate.py scripts/check_reproducible.py scripts/ci_math.py scripts/check_python_lock.py 2>&1 | tee reports/A-4.log
      - shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          python -c "import control_lab; import control_lab.core.rpc; import numpy; import scipy" 2>&1 | tee reports/A-5.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4; GitHub ref verified 2026-11-14
        if: always()
        with:
          name: A-logs
          path: reports/
          if-no-files-found: error
  B:
    name: B - CPython math (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: core_no_sdp
            lock: scripts/requirements-core.lock
          - profile: sdp_available
            lock: scripts/requirements-ci.lock
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; GitHub ref verified 2026-11-14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4; GitHub ref verified 2026-11-14
        with:
          node-version: '24.22.1'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5; GitHub ref verified 2026-11-14
        with:
          python-version: '3.12.14'
      - shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          python -m venv .ci-venv
          PYTHONPATH= .ci-venv/bin/python -m pip install -r "${{ matrix.lock }}" 2>&1 | tee reports/B-install.log
          PYTHONPATH= .ci-venv/bin/python -m pip check 2>&1 | tee reports/B-dependencies.log
      - shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          PYTHONPATH= .ci-venv/bin/python scripts/ci_math.py "${{ matrix.profile }}" 2>&1 | tee reports/B-tests.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4; GitHub ref verified 2026-11-14
        if: always()
        with:
          name: B-${{ matrix.profile }}-evidence
          path: reports/
          if-no-files-found: error
  C:
    name: C - Web contracts and unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; GitHub ref verified 2026-11-14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4; GitHub ref verified 2026-11-14
        with:
          node-version: '24.22.1'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5; GitHub ref verified 2026-11-14
        with:
          python-version: '3.12.14'
      - shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          python -m pip install -r scripts/requirements-ci.lock 2>&1 | tee reports/C-1.log
      - shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          npm --prefix web ci 2>&1 | tee reports/C-2.log
      - shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          npm --prefix web run typecheck 2>&1 | tee reports/C-3.log
      - shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          npm --prefix web test 2>&1 | tee reports/C-4.log
      - shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          node --test tests/integration/*.test.mjs tests/oracles/*.test.mjs 2>&1 | tee reports/C-5.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4; GitHub ref verified 2026-11-14
        if: always()
        with:
          name: C-logs
          path: reports/
          if-no-files-found: error
  D:
    name: D - Real browser Wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; GitHub ref verified 2026-11-14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5; GitHub ref verified 2026-11-14
        with:
          python-version: '3.12.14'
      - shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          python -m pip install -r scripts/requirements-ci.lock 2>&1 | tee reports/D-1.log
      - name: Install real browser test runtime
        shell: bash
        run: |
          set -o pipefail
          python -m pip install -r scripts/requirements-browser.lock 2>&1 | tee reports/D-browser-install.log
          python -m playwright install --with-deps chromium 2>&1 | tee reports/D-browser-binaries.log
      - name: Build complete static release
        shell: bash
        run: |
          set -o pipefail
          npm --prefix web ci 2>&1 | tee reports/D-web-install.log
          npm --prefix web run build 2>&1 | tee reports/D-build.log
      - shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          python scripts/ci_gate.py D 2>&1 | tee reports/D-2.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4; GitHub ref verified 2026-11-14
        if: always()
        with:
          name: D-logs
          path: reports/
          if-no-files-found: error
  E:
    name: E - Browser integration and external gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; GitHub ref verified 2026-11-14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5; GitHub ref verified 2026-11-14
        with:
          python-version: '3.12.14'
      - shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          python -m pip install -r scripts/requirements-ci.lock 2>&1 | tee reports/E-1.log
      - name: Install real browser test runtime
        shell: bash
        run: |
          set -o pipefail
          python -m pip install -r scripts/requirements-browser.lock 2>&1 | tee reports/E-browser-install.log
          python -m playwright install --with-deps chromium firefox 2>&1 | tee reports/E-browser-binaries.log
      - name: Build complete static release
        shell: bash
        run: |
          set -o pipefail
          npm --prefix web ci 2>&1 | tee reports/E-web-install.log
          npm --prefix web run build 2>&1 | tee reports/E-build.log
      - shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          CONTROLLAB_SW_RELEASE_REPORT=reports/E-chromium-sw-release.json python scripts/ci_gate.py E 2>&1 | tee reports/E-2.log
      - name: Provisioned-client two-release regression in Firefox
        shell: bash
        env:
          CONTROLLAB_BROWSER: firefox
          CONTROLLAB_SW_RELEASE_REPORT: reports/E-firefox-sw-release.json
        run: |
          set -o pipefail
          python -m pytest tests/e2e/test_sw_release_update.py -v -s --junitxml=reports/E-firefox-sw-release.xml 2>&1 | tee reports/E-firefox-sw-release.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4; GitHub ref verified 2026-11-14
        if: always()
        with:
          name: E-logs
          path: reports/
          if-no-files-found: error
  F:
    name: F - Browser security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; GitHub ref verified 2026-11-14
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5; GitHub ref verified 2026-11-14
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4; GitHub ref verified 2026-11-14
        with:
          node-version: '24.22.1'
      - shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          python -m pip install -r scripts/requirements-ci.lock 2>&1 | tee reports/F-1.log
      - shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          npm --prefix web ci 2>&1 | tee reports/F-2.log
      - shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          npm --prefix web audit --audit-level=high 2>&1 | tee reports/F-3.log
      - name: Install real browser test runtime
        shell: bash
        run: |
          set -o pipefail
          python -m pip install -r scripts/requirements-browser.lock 2>&1 | tee reports/F-browser-install.log
          python -m playwright install --with-deps chromium 2>&1 | tee reports/F-browser-binaries.log
      - name: Build complete static release
        shell: bash
        run: |
          set -o pipefail
          npm --prefix web run build 2>&1 | tee reports/F-build.log
      - shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          python scripts/ci_gate.py F 2>&1 | tee reports/F-4.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4; GitHub ref verified 2026-11-14
        if: always()
        with:
          name: F-logs
          path: reports/
          if-no-files-found: error
  G:
    name: G - Artifacts and release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; GitHub ref verified 2026-11-14
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5; GitHub ref verified 2026-11-14
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4; GitHub ref verified 2026-11-14
        with:
          node-version: '24.22.1'
      - shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          python -m pip install -r scripts/requirements-ci.lock 2>&1 | tee reports/G-1.log
      - shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          npm --prefix web ci 2>&1 | tee reports/G-2.log
      - shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          python scripts/check_reproducible.py 2>&1 | tee reports/G-3.log
      - shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          python scripts/build_release.py --verify 2>&1 | tee reports/G-4.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4; GitHub ref verified 2026-11-14
        if: always()
        with:
          name: G-unapproved-static-artifacts
          path: web/dist/
          if-no-files-found: error
      - name: Install real browser test runtime
        shell: bash
        run: |
          set -o pipefail
          python -m pip install -r scripts/requirements-browser.lock 2>&1 | tee reports/G-browser-install.log
          python -m playwright install --with-deps chromium 2>&1 | tee reports/G-browser-binaries.log
      - shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          python scripts/ci_gate.py G 2>&1 | tee reports/G-5.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4; GitHub ref verified 2026-11-14
        if: always()
        with:
          name: G-logs
          path: reports/
          if-no-files-found: error
  H:
    name: H - Publish beta GitHub Pages
    # A PR, fork or non-main dispatch can never receive the deployment token.
    if: >-
      github.repository == 'kozttah/ControlLab_Web' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [A, B, C, D, E, F, G]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; same tested github.sha
        with:
          persist-credentials: false
      - name: Keep superseded commits from replacing the current main site
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "$current_sha" = "$GITHUB_SHA" ]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Pages: this tested commit has been superseded on main."
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.current.outputs.eligible == 'true'
        with:
          python-version: '3.12.14'
      - name: Download the exact static artifact already exercised by job G
        if: steps.current.outputs.eligible == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4; verified 2026-11-17
        with:
          name: G-unapproved-static-artifacts
          path: web/dist/
      - name: Verify the downloaded inventory and fixed runtime hashes
        if: steps.current.outputs.eligible == 'true'
        run: python scripts/build_release.py --verify
      - name: Configure Pages metadata
        if: steps.current.outputs.eligible == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5; verified 2026-11-17
        with:
          # First-time enablement is a repository Settings > Pages action.
          # GITHUB_TOKEN has no administration scope; do not introduce a PAT.
          enablement: false
      - name: Upload only the verified static distribution
        if: steps.current.outputs.eligible == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3; verified 2026-11-17
        with:
          path: web/dist/
      - name: Wait for github-pages artifact indexing
        if: steps.current.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=github-pages&per_page=10" --jq '.total_count')"
            if [ "${count:-0}" -ge 1 ]; then
              echo "Artifact github-pages indexed on attempt ${attempt} (total_count=${count})."
              exit 0
            fi
            echo "Waiting for github-pages artifact metadata indexing (attempt ${attempt}/20)..."
            sleep 2
          done
          echo "::error::Artifact github-pages was not indexed within 40s."
          exit 1
      - name: Deploy the tested beta
        if: steps.current.outputs.eligible == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4; verified 2026-11-17

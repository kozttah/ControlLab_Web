[build-system]
requires = ["setuptools>=61.0,==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "control-lab"
version = "1.0.0"
description = "ControlLab Web — Motor científico local-first para identificação, análise e síntese de sistemas de controle"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.21",
]
test = [
    "pytest>=8.0",
    "jsonschema>=4.21",
]
oracles = [
    "pytest>=8.0",
    "jsonschema>=4.21",
]
sdp = [
    "clarabel>=0.7",
    "cvxpy-base>=1.4",
]
all = [
    "pytest>=8.0",
    "jsonschema>=4.21",
    "clarabel>=0.7",
    "cvxpy-base>=1.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["control_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
follow_imports = "skip"
ignore_missing_imports = true
